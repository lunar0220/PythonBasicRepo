<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивная страница</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            text-align: left;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 18px;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 768px){
            p{
                font-size: 14px;
            }

            button{
                width: 100%;
            }

            img{
                width: 100%;
            }
        }

        @media (min-width: 768px) and (max-width: 1024px){
            p{
                font-size: 20px;
            }

            button{
                width: 250px;
                height: auto;
            }

            img{
                max-width: 80%;
                margin: 0 auto 20px;
            }
        }

        @media (min-width: 1024px){
            body{
                text-align: center;
            }

            img{
                max-width: 600px;
                margin: 0 auto 20px;
            }

            button{
                display: block;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <h1>Добро пожаловать!</h1>
    <p>
        Это пример простой адаптивной страницы, которая корректно отображается
        на мобильных устройствах, планшетах и десктопах.
    </p>
    <img src="https://cdn.stocksnap.io/img-thumbs/960w/laptop-working_HB4IJY3TPI.jpg" alt="Пример изображения">
    <button>Подробнее</button>
</body>
</html>
