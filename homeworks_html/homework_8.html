<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>Таблица оценок студентов</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(odd){
            background-color: #e9e8e8;
        }

    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Ф. И. О</th>
                <th>Специализация</th>
                <th>Выбранный курсы</th>
                <th>Оценка за курс</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Иванова Милена Вячеславовна</td>
                <td>Математика</td>
                <td>Python</td>
                <td>Отлично</td>
            </tr>
            <tr>
                <td>Новиков Максим Андреевич</td>
                <td>Физика</td>
                <td>C++</td>
                <td>Удовлетворительно</td>
            </tr>
            <tr>
                <td>Сидоров Виктор Павлович</td>
                <td>Программирование</td>
                <td>Java</td>
                <td>Отлично</td>
            </tr>
                <tr>

        </tbody>

</body>
</html>
