<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Special+Gothic:wght@400..700&display=swap">
    <style>
        body{
            font-family: 'Montserrat';
            padding: 10px;
            font-size: 18px;
            margin: auto;
            background-color: rgb(248, 248, 232);
        }
        table{
            width: 100%;
            border-collapse: collapse;
            border-color:rgb(155, 154, 255);
            border-radius: 20px;
            box-shadow: 10px 10px 5px rgba(0, 0, 0, 0.1);
            border: 5px outset burlywood;
        }
        caption{
            font-style: italic;
            color: fuchsia;
        }
        thead{
            color: cornflowerblue;
            background-color: rgb(196, 255, 254);
        }
        thead:hover{
            background-color: rgb(96, 247, 255);
        }
        tr:nth-child(even){
            background-color: rgb(246, 194, 194);
        }
        tbody:hover{
            background-color: rgb(240, 242, 255);
        }
        tfoot{
            background-color: gainsboro;
        }
        tfoot:hover{
            background-color: rgb(240, 242, 255);
        }
    </style>
</head>
<body>
    <table border="1">
        <caption>Каталог товаров</caption>
        <thead>
            <td>Товар</td>
            <td>Код</td>
            <td>Цена</td>
            <td>Наличие</td>
            <td>Вариации</td>
        </thead>
        <tbody>
            <tr>
                <td>Носки женские</td>
                <td>#29910-3820</td>
                <td>200p</td>
                <td>В наличие</td>
                <td>5 цветов</td>
            </tr>

            <tr>
                <td>Носки мужские</td>
                <td>#23610-3820</td>
                <td>300р</td>
                <td>Нет</td>
                <td>2 цвета</td>
            </tr>

            <tr>
                <td>Бантик для волос</td>
                <td>#98910-3820</td>
                <td>1000р</td>
                <td>Нет</td>
                <td>--</td>
            </tr>

            <tr>
                <td>Резинки для волос</td>
                <td>#292320-3820</td>
                <td>300р</td>
                <td>В наличие</td>
                <td>3 цвета</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Итого</td>
                <td colspan="4">1800p</td>                
            </tr>
        </tfoot>
    </table>
</body>
</html>
