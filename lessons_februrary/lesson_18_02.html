<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: deeppink;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            padding: 20px;
            min-height: 80vh;
        }
        form{
            background-color: white;
            margin-bottom: 20px;
            padding: 30px;
            min-height: 10vh;
            max-width: 500%;
            width: 100%;
        }
    </style>
</head>
<body>
    <form action="/login.php" method="post">
        <label for="FIO">ФИО:</label>
        <input type="text" placeholder="Введите ФИО" pattern=".{3,}">
        <input type="date" placeholder="Введите дату рождения" class="name" id="name" required>
        <input type="password" placeholder="Введи пароль" class="name" id="name" required>
        <input type="email" placeholder="Почта" class="name" id="name" required>
        <select>
            <option value="">-- Выберите Город --</option>
            <option value="kazan">Kazan</option>
            <option value="ufa">Ufa</option>
            <option value="mockov">Mockov</option>
            <option value="stpeter">St. Petersburg</option>
        </select>
        <textarea id="info" class="info" rows="6" cols="70" placeholder="Напишите о себе"></textarea>
        <button type="submit">Отправка</button>
        <button type="reset">Сброс</button>
    </form>
</body>
</html>
